{% extends "base.html" %}
{% block title %}绑定 Lichess - AlphaGames{% endblock %}
{% block content %}
<div class="dashboard-header">
    <div class="user-greeting">
        <div class="avatar-large"><svg viewBox="0 0 24 24" width="32" height="32" stroke="currentColor" stroke-width="1.5" fill="none"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg></div>
        <div>
            <h2>绑定 Lichess 账号</h2>
            <p class="text-muted">连接全球最大的开源国际象棋平台</p>
        </div>
    </div>
</div>

<div class="section-card" style="max-width: 600px; margin: 0 auto;">
    <div class="card-header">
        <h3>账号授权</h3>
    </div>
    <div class="card-body">
        {% if lichess_info %}
        <div class="info-box mb-6">
            <span class="info-label">当前绑定账号</span>
            <span class="badge badge-success text-lg inline-block mt-2">{{ lichess_info.lichess_username }}</span>
        </div>
        {% endif %}

        <form method="post" class="auth-form">
            <div class="form-group">
                <label>Lichess 用户名</label>
                <input type="text" name="lichess_username" required placeholder="您的 Lichess 用户名" value="{{ lichess_info.lichess_username if lichess_info else '' }}">
            </div>
            <div class="form-group">
                <label>API Token</label>
                <input type="text" name="lichess_token" required placeholder="lip_xxxxxxxxxxxxxxxx">
                <p class="text-muted mt-2" style="font-size: 0.8rem;">请在 Lichess 设置中生成具有下棋权限的 Personal API token</p>
            </div>
            <div class="flex-row gap-6 mt-6">
                <button type="submit" class="btn-primary flex-1">{{ '更新授权信息' if lichess_info else '确认绑定' }}</button>
                <a href="/dashboard" class="btn-outline">返回面板</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
