{% extends "base.html" %}
{% block title %}对局配置 - AlphaGames{% endblock %}
{% block content %}
<div class="dashboard-header">
    <div class="user-greeting">
        <div class="avatar-large">
            <svg viewBox="0 0 24 24" width="32" height="32" stroke="currentColor" stroke-width="1.5" fill="none"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        </div>
        <div>
            <h2>对局配置</h2>
            <p class="text-muted">设置 AI 难度、阵营偏好与时控参数</p>
        </div>
    </div>
</div>

<div class="section-card" style="max-width: 540px; margin: 0 auto;">
    <div class="card-header">
        <h3>对战参数</h3>
    </div>
    <div class="card-body">
        <form method="post" class="auth-form">
            <div class="form-group">
                <label>阵营偏好</label>
                <div class="flex-row gap-6 mt-2">
                    <label class="radio-card flex-1">
                        <input type="radio" name="engineColor" value="random" {{ 'checked' if not config or config.engineColor == 'random' else '' }}>
                        <span class="radio-label">随机</span>
                    </label>
                    <label class="radio-card flex-1">
                        <input type="radio" name="engineColor" value="white" {{ 'checked' if config and config.engineColor == 'white' else '' }}>
                        <span class="radio-label">白方</span>
                    </label>
                    <label class="radio-card flex-1">
                        <input type="radio" name="engineColor" value="black" {{ 'checked' if config and config.engineColor == 'black' else '' }}>
                        <span class="radio-label">黑方</span>
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label>AI 难度 (Elo)</label>
                <div class="flex-between mt-2">
                    <input type="range" name="aiLevel" id="aiLevel" min="800" max="2900" step="100" value="{{ config.aiLevel if config else 1500 }}" class="flex-1" oninput="updateElo(this.value)">
                    <span class="badge badge-primary" id="eloVal" style="min-width: 2.5rem; text-align: center; margin-left: 0.75rem;">{{ config.aiLevel if config else 1500 }}</span>
                </div>
                <div id="eloDesc" class="info-box mt-2" style="text-align: center; padding: 4px 12px;"></div>
            </div>

            <div class="form-group">
                <label>初始时间（分钟）</label>
                <input type="number" name="time" min="1" max="180" value="{{ config.time if config else 10 }}">
            </div>

            <div class="form-group">
                <label>每步加秒</label>
                <input type="number" name="increment" min="0" max="60" value="{{ config.increment if config else 5 }}">
            </div>

            <div class="form-group">
                <label>人人对战模式</label>
                <div class="flex-row gap-6 mt-2">
                    <label class="radio-card flex-1">
                        <input type="radio" name="pvpMode" value="random" {{ 'checked' if not config or config.pvpMode == 'random' else '' }} onclick="togglePvp()">
                        <span class="radio-label">随机匹配</span>
                    </label>
                    <label class="radio-card flex-1">
                        <input type="radio" name="pvpMode" value="designated" {{ 'checked' if config and config.pvpMode == 'designated' else '' }} onclick="togglePvp()">
                        <span class="radio-label">指定对手</span>
                    </label>
                </div>
                <div id="pvpOpponentWrap" style="display:{{ 'block' if config and config.pvpMode == 'designated' else 'none' }}; margin-top: 0.75rem;">
                    <input type="text" name="pvpOpponent" placeholder="Lichess 用户名" value="{{ config.pvpOpponent if config else '' }}" style="width:100%;">
                </div>
            </div>

            <div class="flex-row gap-6 mt-6">
                <button type="submit" class="btn-primary flex-1">保存配置</button>
                <a href="/dashboard" class="btn-outline">返回面板</a>
            </div>
        </form>
    </div>
</div>

<script>
var _lv = [{lo:800,hi:999,l:"入门"},{lo:1000,hi:1300,l:"初级"},{lo:1400,hi:1700,l:"中级"},{lo:1800,hi:2000,l:"进阶"},{lo:2100,hi:2300,l:"高级"},{lo:2400,hi:2600,l:"专家"},{lo:2700,hi:2800,l:"国家大师"},{lo:2900,hi:9999,l:"特级大师"}];
function updateElo(v) {
    document.getElementById('eloVal').textContent = v;
    var d = '';
    for (var i = 0; i < _lv.length; i++) {
        if (v >= _lv[i].lo && v <= _lv[i].hi) { d = _lv[i].l; break; }
    }
    document.getElementById('eloDesc').textContent = d;
}
function togglePvp() {
    var m = document.querySelector('input[name="pvpMode"]:checked').value;
    document.getElementById('pvpOpponentWrap').style.display = m === 'designated' ? 'block' : 'none';
}
updateElo(document.getElementById('aiLevel').value);
</script>
{% endblock %}
