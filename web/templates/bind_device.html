{% extends "base.html" %}
{% block title %}绑定棋盘 - AlphaGames{% endblock %}
{% block content %}
<h1>绑定物理棋盘</h1>
{% if device %}
    <p>当前绑定: <code>{{ device.sn }}</code></p>
{% endif %}
<form method="post">
    <label>棋盘 SN 码
        <input name="sn" required placeholder="输入棋盘背面的SN码"
               value="{{ device.sn if device else '' }}">
    </label>
    <button type="submit">{{ '更新' if device else '绑定' }}</button>
</form>
<p class="hint"><a href="/dashboard">返回面板</a></p>
{% endblock %}
