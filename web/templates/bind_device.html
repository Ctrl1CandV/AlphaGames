{% extends "base.html" %}
{% block title %}绑定棋盘 - AlphaGames{% endblock %}
{% block content %}
<div class="dashboard-header">
    <div class="user-greeting">
        <div class="avatar-large"><svg viewBox="0 0 24 24" width="32" height="32" stroke="currentColor" stroke-width="1.5" fill="none"><rect x="4" y="4" width="16" height="16" rx="2" ry="2"></rect><rect x="9" y="9" width="6" height="6"></rect></svg></div>
        <div>
            <h2>绑定物理棋盘</h2>
            <p class="text-muted">连接您的实体智能棋盘设备</p>
        </div>
    </div>
</div>

<div class="section-card" style="max-width: 600px; margin: 0 auto;">
    <div class="card-header">
        <h3>设备信息</h3>
    </div>
    <div class="card-body">
        {% if device %}
        <div class="info-box mb-6">
            <span class="info-label">当前绑定设备</span>
            <code class="text-primary text-lg">{{ device.sn }}</code>
        </div>
        {% endif %}

        <form method="post" class="auth-form">
            <div class="form-group">
                <label>棋盘 SN 码</label>
                <input type="text" name="sn" required placeholder="输入棋盘背面的SN码" value="{{ device.sn if device else '' }}">
                <p class="text-muted mt-2" style="font-size: 0.8rem;">SN 码通常位于设备底部或包装盒上</p>
            </div>
            <div class="flex-row gap-6 mt-6">
                <button type="submit" class="btn-primary flex-1">{{ '更新绑定设备' if device else '确认绑定' }}</button>
                <a href="/dashboard" class="btn-outline">返回面板</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
