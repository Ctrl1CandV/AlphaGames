{% extends "base.html" %}
{% block title %}注册 - AlphaGames{% endblock %}
{% block content %}
<div class="auth-container">
    <div class="auth-box">
        <div class="auth-header">
            <h1>创建账号</h1>
            <p class="auth-subtitle">加入 AlphaGames，开启您的对弈之旅</p>
        </div>

        <form method="post" class="auth-form">
            <div class="form-group">
                <label>用户名</label>
                <input type="text" name="username" required autocomplete="username" placeholder="请输入用户名">
            </div>
            <div class="form-group">
                <label>密码</label>
                <input name="password" type="password" required autocomplete="new-password" placeholder="至少 6 位字符">
            </div>
            <div class="form-group">
                <label>确认密码</label>
                <input name="confirm_password" type="password" required autocomplete="new-password" placeholder="再次输入密码">
            </div>
            <button type="submit" class="btn-primary btn-block">注 册</button>
        </form>
        <p class="auth-footer">已有账号？<a href="/login">立即登录</a></p>
    </div>
</div>
{% endblock %}
